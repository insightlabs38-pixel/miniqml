[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniqml-qiskit-subset"
version = "0.5.0"
description = "A small PennyLane-style quantum circuit API backed by Qiskit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "qiskit~=2.5.2",
    "qiskit-aer~=0.18.2",
    "torch>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
demo = ["scikit-learn>=1.4", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["miniqml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
